[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "uexinfo"
version = "0.1.0"
description = "Overlay Star Citizen — UEX Corp 2.0 API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "tomli-w>=1.0",
    "appdirs>=1.4",
    "Pillow>=10.0",
    "pytesseract>=0.3",
    "rapidfuzz>=3.0",
    "pywebview>=5.0",
    "pynput>=1.7",
    "websockets>=12.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[project.scripts]
uexinfo = "uexinfo.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uexinfo*"]
